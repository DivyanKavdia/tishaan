<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#ffd84d">
<title>Chikoo & Bunty: Mischief Chase · Tishaan's Game Zone</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1b1744;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100vh}.top{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;z-index:6;pointer-events:none}.pill,.back{pointer-events:auto;border:2px solid #ffffff55;background:#211b55dd;color:#fff;border-radius:999px;padding:9px 13px;font-weight:900;text-decoration:none;box-shadow:0 7px 20px #0003}.stats{display:flex;gap:7px}.stat{min-width:74px;text-align:center}.stat small{display:block;font-size:9px;letter-spacing:.11em;color:#ffe88a}.stat b{font-size:18px}.controls{position:fixed;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));display:flex;justify-content:center;gap:13px;z-index:7}.ctrl{width:88px;height:66px;border:2px solid #fff7;border-radius:22px;background:#251f66e8;color:white;font-size:27px;font-weight:1000;box-shadow:0 10px 24px #0005}.jump{width:118px;background:linear-gradient(180deg,#ff8e44,#ee4c5b);font-size:15px}.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:22px;background:#191343cc;backdrop-filter:blur(6px);z-index:20}.card{width:min(92vw,440px);padding:26px;border:2px solid #ffffff33;border-radius:30px;background:linear-gradient(160deg,#322773f2,#1c164ef2);box-shadow:0 28px 80px #0009;text-align:center}.faces{display:flex;justify-content:center;gap:10px;font-size:55px}.faces span{display:grid;place-items:center;width:82px;height:82px;border-radius:26px;background:#fff2;transform:rotate(-5deg)}.faces span:last-child{transform:rotate(6deg)}h1{font-size:42px;line-height:.9;margin:12px 0;letter-spacing:-.05em}h1 em{font-style:normal;color:#ffd84d}.card p{color:#dedaf5;line-height:1.45}.play{border:0;border-radius:999px;background:#ffd84d;color:#2a215a;padding:15px 24px;font-size:16px;font-weight:1000;box-shadow:0 9px 25px #f0c83355}.tip{font-size:12px!important;color:#aaa5d5!important}.hidden{display:none}
</style>
</head><body>
<canvas id="game" width="720" height="1280"></canvas>
<div class="top"><a class="back" href="../../">← Game Zone</a><div class="stats"><div class="pill stat"><small>SCORE</small><b id="score">0</b></div><div class="pill stat"><small>HEARTS</small><b id="lives">❤❤❤</b></div></div></div>
<div class="controls hidden" id="controls"><button class="ctrl" data-dir="l">←</button><button class="ctrl jump" id="jump">JUMP<br>⬆</button><button class="ctrl" data-dir="r">→</button></div>
<div class="overlay" id="start"><div class="card"><div class="faces"><span>😎</span><span>😜</span></div><h1>CHIKOO &amp; BUNTY<br><em>MISCHIEF CHASE</em></h1><p>The neighbourhood is in chaos! Race through the lanes, dodge silly obstacles and collect as many treats as you can before the mischief catches up.</p><button class="play" id="play">START THE CHASE</button><p class="tip">Move left/right · jump over obstacles · collect stars and laddoos</p></div></div>
<div class="overlay hidden" id="over"><div class="card"><div class="faces"><span>😵</span><span>😂</span></div><h1>WHAT A<br><em>CHASE!</em></h1><p id="final"></p><button class="play" id="again">PLAY AGAIN</button></div></div>
<script>
const c=document.getElementById('game'),g=c.getContext('2d'),W=720,H=1280;let running=false,last=0,score=0,lives=3,speed=430,spawnT=0,keys={};let p,obs,good,clouds,hitFlash=0;
function reset(){p={x:360,y:1010,w:62,h:76,vx:0,vy:0,ground:1010};obs=[];good=[];clouds=[{x:80,y:150,s:1},{x:430,y:250,s:.8},{x:610,y:110,s:.65}];score=0;lives=3;speed=430;spawnT=.7;hitFlash=0;sync()}
function sync(){document.getElementById('score').textContent=score;document.getElementById('lives').textContent='❤'.repeat(lives)+'♡'.repeat(3-lives)}
function start(){reset();running=true;last=performance.now();startEl.classList.add('hidden');over.classList.add('hidden');controls.classList.remove('hidden');requestAnimationFrame(loop)}
function spawn(){let lane=[210,360,510][Math.floor(Math.random()*3)];if(Math.random()<.34)good.push({x:lane,y:-50,r:22,t:Math.random()<.5?'star':'sweet'});else obs.push({x:lane,y:-70,w:70,h:58,t:Math.random()<.5?'crate':'puddle'});spawnT=Math.max(.42,.9-score*.0035)}
function jump(){if(Math.abs(p.y-p.ground)<2)p.vy=-720}
function update(dt){hitFlash=Math.max(0,hitFlash-dt);let dir=(keys.r?1:0)-(keys.l?1:0);p.x+=dir*360*dt;p.x=Math.max(95,Math.min(W-95,p.x));p.vy+=1800*dt;p.y+=p.vy*dt;if(p.y>p.ground){p.y=p.ground;p.vy=0}spawnT-=dt;if(spawnT<=0)spawn();speed=Math.min(820,430+score*5);for(let o of obs)o.y+=speed*dt;for(let q of good)q.y+=speed*dt;for(let cl of clouds){cl.x-=18*cl.s*dt;if(cl.x<-120)cl.x=W+100}
let px=p.x,py=p.y-20;for(let o of obs){if(Math.abs(o.x-px)<55&&Math.abs(o.y-py)<63&&!o.hit){o.hit=true;lives--;hitFlash=.25;sync();if(lives<=0)return end()}}for(let q of good){if(Math.hypot(q.x-px,q.y-py)<55&&!q.hit){q.hit=true;score+=q.t==='star'?3:1;sync()}}obs=obs.filter(o=>o.y<H+100&&!o.hit);good=good.filter(q=>q.y<H+80&&!q.hit)}
function end(){running=false;controls.classList.add('hidden');let best=Math.max(score,+localStorage.getItem('chikoo-bunty-best')||0);localStorage.setItem('chikoo-bunty-best',best);final.innerHTML=`You collected <b>${score}</b> points.<br>Best score: <b>${best}</b>`;over.classList.remove('hidden')}
function draw(){let bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#6bdcff');bg.addColorStop(.55,'#b8f0ff');bg.addColorStop(.56,'#ffd889');bg.addColorStop(1,'#f2a94f');g.fillStyle=bg;g.fillRect(0,0,W,H);
for(let cl of clouds){g.globalAlpha=.72;g.fillStyle='#fff';g.beginPath();g.arc(cl.x,cl.y,42*cl.s,0,7);g.arc(cl.x+38*cl.s,cl.y+5,30*cl.s,0,7);g.arc(cl.x-40*cl.s,cl.y+9,27*cl.s,0,7);g.fill()}g.globalAlpha=1;
// houses
for(let i=0;i<6;i++){let x=40+i*135,y=470+(i%2)*35;g.fillStyle=i%2?'#ff796c':'#ffd45f';g.fillRect(x,y,105,180);g.fillStyle='#7a3a4c';g.beginPath();g.moveTo(x-10,y);g.lineTo(x+52,y-70);g.lineTo(x+115,y);g.fill();g.fillStyle='#78bcd1';g.fillRect(x+18,y+38,26,42);g.fillRect(x+61,y+38,26,42)}
// road
g.fillStyle='#69677a';g.beginPath();g.moveTo(110,610);g.lineTo(610,610);g.lineTo(720,H);g.lineTo(0,H);g.fill();g.strokeStyle='#fff8';g.lineWidth=12;g.setLineDash([42,35]);g.beginPath();g.moveTo(300,650);g.lineTo(250,H);g.moveTo(420,650);g.lineTo(470,H);g.stroke();g.setLineDash([]);
for(let q of good){g.font='45px system-ui';g.textAlign='center';g.fillText(q.t==='star'?'⭐':'🟠',q.x,q.y)}for(let o of obs){g.font='58px system-ui';g.textAlign='center';g.fillText(o.t==='crate'?'📦':'🕳️',o.x,o.y+20)}
// player duo
g.save();g.translate(p.x,p.y);if(hitFlash>0)g.globalAlpha=.35;g.fillStyle='#28325e';g.fillRect(-33,-40,66,62);g.fillStyle='#ffce9e';g.beginPath();g.arc(-18,-61,24,0,7);g.arc(22,-67,23,0,7);g.fill();g.fillStyle='#16152e';g.beginPath();g.arc(-18,-68,24,3.15,6.2);g.arc(22,-74,23,3.15,6.2);g.fill();g.fillStyle='#fff';g.fillRect(-28,-64,18,8);g.fillRect(12,-69,18,8);g.fillStyle='#111';g.fillRect(-20,-63,5,5);g.fillRect(19,-68,5,5);g.fillStyle='#ff8a45';g.fillRect(-32,20,25,28);g.fillStyle='#ffd84d';g.fillRect(8,20,25,28);g.restore();
// score sparkles
if(score>0){g.fillStyle='#fff';g.font='bold 22px system-ui';g.textAlign='left';g.fillText('Keep going! ✨',24,190)}}
function loop(t){if(!running)return;let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}
const startEl=document.getElementById('start'),controls=document.getElementById('controls'),over=document.getElementById('over'),final=document.getElementById('final');document.getElementById('play').onclick=start;document.getElementById('again').onclick=start;document.getElementById('jump').onpointerdown=e=>{e.preventDefault();jump()};for(let b of document.querySelectorAll('[data-dir]')){let d=b.dataset.dir;b.onpointerdown=e=>{e.preventDefault();keys[d]=true;b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=()=>keys[d]=false}addEventListener('keydown',e=>{if(e.key==='ArrowLeft')keys.l=true;if(e.key==='ArrowRight')keys.r=true;if(e.code==='Space'||e.key==='ArrowUp')jump()});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')keys.l=false;if(e.key==='ArrowRight')keys.r=false});reset();draw();
</script></body></html>
