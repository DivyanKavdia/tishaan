<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#13070a">
<title>Iron Flight · Tishaan's Game Zone</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#12070a;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}.wrap{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#512018 0,#1b0b0d 38%,#080608 100%)}canvas{width:min(100vw,720px);height:100vh;display:block}.top{position:fixed;top:max(12px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 16px;pointer-events:none}.back,.sound{pointer-events:auto;border:1px solid #ffffff30;background:#0008;color:white;border-radius:999px;padding:10px 14px;text-decoration:none;font-weight:800;backdrop-filter:blur(10px)}.hud{font-weight:900;text-align:center;text-shadow:0 2px 12px #000}.hud small{display:block;font-size:10px;letter-spacing:.18em;color:#ffd36a}.hud b{font-size:25px}.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:28px;background:#08060899;backdrop-filter:blur(7px)}.card{width:min(92vw,430px);padding:28px;border:1px solid #ffffff24;border-radius:28px;background:linear-gradient(160deg,#351011ee,#13080bee);box-shadow:0 30px 90px #0009;text-align:center}.core{width:86px;height:86px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#fff 0 8%,#6eeeff 9% 20%,#176c85 21% 33%,#ffb72e 34% 38%,#5b1710 39%);box-shadow:0 0 38px #6eeeff99,0 0 70px #ff8f2f55}.card h1{font-size:44px;line-height:.9;margin:6px 0 12px;letter-spacing:-.05em}.card h1 span{color:#ffc44f}.card p{color:#ddd0c7;line-height:1.45;margin:0 auto 20px;max-width:330px}.play{border:0;border-radius:999px;padding:15px 25px;font-size:16px;font-weight:1000;background:#ffbf3f;color:#251100;box-shadow:0 8px 28px #ff970955}.tip{font-size:12px!important;color:#a89790!important;margin-top:14px!important}.hidden{display:none}.flash{position:fixed;inset:0;pointer-events:none;background:white;opacity:0;transition:opacity .15s}.flash.on{opacity:.22}
</style>
</head>
<body>
<div class="wrap"><canvas id="game" width="720" height="1280"></canvas></div>
<div class="top"><a class="back" href="../../">← Game Zone</a><div class="hud"><small>SCORE</small><b id="score">0</b></div><button class="sound" id="sound">🔊</button></div>
<div class="overlay" id="start"><div class="card"><div class="core"></div><h1>IRON<br><span>FLIGHT</span></h1><p>Blast through the skyline, dodge enemy drones and collect glowing energy cores. How far can you fly?</p><button class="play" id="play">TAP TO LAUNCH</button><p class="tip">Hold anywhere to fly up · release to drop</p></div></div>
<div class="overlay hidden" id="over"><div class="card"><div class="core"></div><h1>MISSION<br><span>COMPLETE</span></h1><p id="final">Score 0</p><button class="play" id="again">FLY AGAIN</button><p class="tip">Best score is saved on this device</p></div></div>
<div class="flash" id="flash"></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'),scoreEl=document.getElementById('score');
let running=false,holding=false,last=0,score=0,best=+localStorage.getItem('iron-flight-best')||0,sound=true;
let hero,obstacles,cores,stars,particles,speed;
const W=720,H=1280;
function reset(){hero={x:150,y:H*.48,vy:0,r:31};obstacles=[];cores=[];particles=[];stars=Array.from({length:80},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+1,v:20+Math.random()*80}));score=0;speed=310;scoreEl.textContent='0';}
function beep(f=440,d=.07){if(!sound)return;try{let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.type='square';g.gain.setValueAtTime(.05,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
function spawn(){let gap=280,cy=230+Math.random()*(H-460),w=86;obstacles.push({x:W+100,y:cy-gap/2-320,w,h:320},{x:W+100,y:cy+gap/2,w,h:H-(cy+gap/2)});if(Math.random()<.85)cores.push({x:W+180,y:cy,r:18,spin:0});}
function explode(px,py){for(let i=0;i<24;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*500,vy:(Math.random()-.5)*500,t:.7+Math.random()*.5})}
function start(){reset();running=true;last=performance.now();document.getElementById('start').classList.add('hidden');document.getElementById('over').classList.add('hidden');requestAnimationFrame(loop);beep(620,.1)}
function end(){if(!running)return;running=false;explode(hero.x,hero.y);beep(100,.25);best=Math.max(best,Math.floor(score));localStorage.setItem('iron-flight-best',best);document.getElementById('final').innerHTML=`Score <b>${Math.floor(score)}</b><br>Best <b>${best}</b>`;setTimeout(()=>document.getElementById('over').classList.remove('hidden'),350)}
function hitRectCircle(o,h){let nx=Math.max(o.x,Math.min(h.x,o.x+o.w)),ny=Math.max(o.y,Math.min(h.y,o.y+o.h));return (h.x-nx)**2+(h.y-ny)**2<h.r**2}
function update(dt){hero.vy+=(holding?-1250:900)*dt;hero.vy=Math.max(-500,Math.min(650,hero.vy));hero.y+=hero.vy*dt;speed+=dt*4;score+=dt*10;scoreEl.textContent=Math.floor(score);
if(!obstacles.length||obstacles[obstacles.length-1].x<W-430)spawn();
for(const s of stars){s.x-=s.v*dt;if(s.x<0){s.x=W;s.y=Math.random()*H}}
for(const o of obstacles)o.x-=speed*dt;for(const q of cores){q.x-=speed*dt;q.spin+=dt*5}
obstacles=obstacles.filter(o=>o.x+o.w>-20);cores=cores.filter(q=>{if((hero.x-q.x)**2+(hero.y-q.y)**2<(hero.r+q.r)**2){score+=25;beep(880,.06);document.getElementById('flash').classList.add('on');setTimeout(()=>document.getElementById('flash').classList.remove('on'),80);return false}return q.x>-30});
for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt}particles=particles.filter(p=>p.t>0);
if(hero.y<-40||hero.y>H+40||obstacles.some(o=>hitRectCircle(o,hero)))end();}
function draw(){x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#190a18');g.addColorStop(.6,'#4a1714');g.addColorStop(1,'#11080a');x.fillStyle=g;x.fillRect(0,0,W,H);
for(const s of stars){x.globalAlpha=.3+s.s/4;x.fillStyle='#ffd7a2';x.fillRect(s.x,s.y,s.s,s.s*4)}x.globalAlpha=1;
// skyline
x.fillStyle='#110a0e';for(let i=0;i<12;i++){let bx=i*72-((score*3)%72),bh=160+((i*73)%260);x.fillRect(bx,H-bh,58,bh);x.fillStyle='#ffb23333';for(let wy=H-bh+25;wy<H-20;wy+=34)for(let wx=bx+10;wx<bx+48;wx+=20)x.fillRect(wx,wy,8,12);x.fillStyle='#110a0e'}
// drones
for(const o of obstacles){let dg=x.createLinearGradient(o.x,0,o.x+o.w,0);dg.addColorStop(0,'#1b252d');dg.addColorStop(.5,'#384954');dg.addColorStop(1,'#151c20');x.fillStyle=dg;x.fillRect(o.x,o.y,o.w,o.h);x.fillStyle='#ef443c';for(let yy=o.y+25;yy<o.y+o.h;yy+=75)x.fillRect(o.x+22,yy,o.w-44,8)}
// cores
for(const q of cores){x.save();x.translate(q.x,q.y);x.rotate(q.spin);x.shadowColor='#8df6ff';x.shadowBlur=28;x.fillStyle='#dfffff';x.beginPath();for(let i=0;i<8;i++){let a=i*Math.PI/4,r=i%2?9:20;x.lineTo(Math.cos(a)*r,Math.sin(a)*r)}x.closePath();x.fill();x.restore()}
// hero
x.save();x.translate(hero.x,hero.y);x.rotate(hero.vy*.00035);x.shadowColor='#ff9b3d';x.shadowBlur=28;x.fillStyle='#cc2520';x.beginPath();x.moveTo(-34,-24);x.lineTo(24,-20);x.lineTo(36,0);x.lineTo(20,24);x.lineTo(-32,22);x.closePath();x.fill();x.fillStyle='#f7b531';x.fillRect(-8,-22,22,44);x.fillStyle='#a7f6ff';x.beginPath();x.arc(6,0,9,0,Math.PI*2);x.fill();x.fillStyle='#78eaff';x.beginPath();x.moveTo(-38,-12);x.lineTo(-74,0);x.lineTo(-38,12);x.closePath();x.fill();x.restore();
for(const p of particles){x.globalAlpha=Math.max(0,p.t);x.fillStyle='#ffc34b';x.fillRect(p.x,p.y,7,7)}x.globalAlpha=1;}
function loop(t){let dt=Math.min(.032,(t-last)/1000);last=t;if(running)update(dt);draw();if(running||particles.length)requestAnimationFrame(loop)}
function press(v){holding=v}addEventListener('pointerdown',e=>{if(e.target.closest('button,a'))return;press(true)});addEventListener('pointerup',()=>press(false));addEventListener('pointercancel',()=>press(false));addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();press(true)}});addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp')press(false)});
document.getElementById('play').onclick=start;document.getElementById('again').onclick=start;document.getElementById('sound').onclick=()=>{sound=!sound;document.getElementById('sound').textContent=sound?'🔊':'🔇'};reset();draw();
</script>
</body></html>
