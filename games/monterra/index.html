<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Monterra Wilds</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#071b20;color:#fff;overflow:hidden}#g{width:100vw;height:100vh;display:block}.hud{position:fixed;inset:12px 12px auto;display:flex;justify-content:space-between;pointer-events:none}.pill{background:#061318dd;border:1px solid #ffffff25;border-radius:18px;padding:9px 13px;font-weight:800}.controls{position:fixed;bottom:22px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:end}.pad{display:grid;grid-template-columns:55px 55px 55px;gap:5px}.pad button:nth-child(1){grid-column:2}.pad button{width:55px;height:55px}.actions{display:grid;gap:8px}.actions button{min-width:105px}button{border:0;border-radius:18px;background:#ffffffd9;font-weight:900;font-size:16px;padding:14px;touch-action:none}.panel{position:fixed;inset:0;background:#041216e8;display:grid;place-items:center;padding:20px}.card{max-width:420px;width:100%;background:#102b2f;border:1px solid #ffffff25;border-radius:28px;padding:24px;text-align:center}.monster{font-size:76px;filter:drop-shadow(0 8px 8px #0008)}.bar{height:12px;background:#0005;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#74e28b}.hidden{display:none}.small{opacity:.72;font-size:13px}</style></head><body><canvas id="g"></canvas><div class="hud"><div class="pill">MONTERra WILDS<br><span id="zone" class="small">Verdant Trail</span></div><div class="pill">⭐ <span id="lvl">5</span> · Orbs <span id="orbs">8</span></div></div><div class="controls"><div class="pad"><button data-d="u">▲</button><button data-d="l">◀</button><button data-d="d">▼</button><button data-d="r">▶</button></div><div class="actions"><button id="team">TEAM</button><button id="scan">SCAN</button></div></div><div id="modal" class="panel hidden"><div class="card"><div id="mon" class="monster">🔥</div><h1 id="name">Embercub</h1><p id="desc">A wild creature appeared!</p><div class="bar"><i id="hp" style="width:100%"></i></div><p id="stats"></p><button id="attack">ATTACK</button> <button id="catch">THROW ORB</button><p><button id="close">RUN</button></p></div></div><script>const c=document.querySelector('#g'),x=c.getContext('2d');let W,H,p={x:8,y:8},orbs=8,level=5,owned=[{n:'Embercub',e:'🔥',lv:5,xp:0,stage:0}],wild=null;const mons=[['Embercub','🔥','Pyrolynx','🦁','Volcarion','🐲'],['Spriglet','🌱','Florabbit','🐇','Verdantusk','🐘'],['Aquaff','💧','Tideruff','🦭','Leviwave','🐋'],['Voltkit','⚡','Stormcat','🐆','Thundrake','🐉'],['Pebblit','🪨','Cragoon','🦏','Titanrock','🦖']];function size(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);draw()}onresize=size;function draw(){let w=innerWidth,h=innerHeight;x.fillStyle='#123d32';x.fillRect(0,0,w,h);for(let i=0;i<70;i++){let a=(i*83)%w,b=(i*137)%h;x.fillStyle=i%4?'#1d5940':'#75a94d';x.beginPath();x.arc(a,b,8+(i%5)*3,0,7);x.fill()}x.fillStyle='#c5a86a';x.fillRect(w*.18,0,w*.18,h);x.fillRect(0,h*.42,w,h*.14);x.fillStyle='#62b9d4';x.fillRect(w*.72,0,w*.12,h);x.fillStyle='#fff';x.font='36px system-ui';x.fillText('🧢',p.x/16*w-18,p.y/16*h+12);x.font='24px system-ui';x.fillText('🌲',w*.1,h*.2);x.fillText('🏕️',w*.5,h*.22);x.fillText('⛰️',w*.82,h*.35)}function move(d){if(d==='u')p.y=Math.max(1,p.y-1);if(d==='d')p.y=Math.min(15,p.y+1);if(d==='l')p.x=Math.max(1,p.x-1);if(d==='r')p.x=Math.min(15,p.x+1);draw();if(Math.random()<.18)encounter()}document.querySelectorAll('[data-d]').forEach(b=>{b.onpointerdown=()=>move(b.dataset.d)});function encounter(){let m=mons[Math.random()*mons.length|0],s=Math.random()<.1?1:0;wild={m,stage:s,hp:100,lv:3+Math.random()*6|0};mon.textContent=m[s*2+1];name.textContent=m[s*2];desc.textContent='A wild '+m[s*2]+' appeared in the tall grass!';stats.textContent='Lv. '+wild.lv+' · Wild';hp.style.width='100%';modal.classList.remove('hidden')}attack.onclick=()=>{if(!wild)return;wild.hp-=25+Math.random()*25;hp.style.width=Math.max(0,wild.hp)+'%';if(wild.hp<=0){gain(30);desc.textContent='Victory! Your creature gained experience.';attack.disabled=true}};catch.onclick=()=>{if(!wild||orbs<1)return;orbs--;document.querySelector('#orbs').textContent=orbs;let chance=.35+(100-wild.hp)/130;if(Math.random()<chance){owned.push({n:wild.m[wild.stage*2],e:wild.m[wild.stage*2+1],lv:wild.lv,xp:0,stage:wild.stage,m:wild.m});desc.textContent='Caught! '+wild.m[wild.stage*2]+' joined your team!';catch.disabled=true}else desc.textContent='It broke free! Weaken it and try again.'};function gain(v){let a=owned[0];a.xp+=v;if(a.xp>=60){a.xp-=60;a.lv++;level=a.lv;lvl.textContent=level;if((a.lv===7||a.lv===12)&&a.stage<2){a.stage++;let m=a.m||mons[0];a.n=m[a.stage*2];a.e=m[a.stage*2+1];desc.textContent='EVOLUTION! Your partner evolved into '+a.n+'!';mon.textContent=a.e;name.textContent=a.n}}}close.onclick=()=>{modal.classList.add('hidden');attack.disabled=catch.disabled=false;wild=null};scan.onclick=encounter;team.onclick=()=>{let a=owned[0];wild=null;mon.textContent=a.e;name.textContent=a.n;desc.textContent='Your lead companion';stats.textContent='Lv. '+a.lv+' · XP '+a.xp+'/60 · Team '+owned.length;hp.style.width='100%';attack.style.display=catch.style.display='none';modal.classList.remove('hidden')};document.querySelector('#close').addEventListener('click',()=>{attack.style.display=catch.style.display='inline-block'});addEventListener('keydown',e=>move({ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'}[e.key]||''));size()</script></body></html>
